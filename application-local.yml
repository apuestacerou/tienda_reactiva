# Configuración local (versionada en el repo). Sustituye host, usuario y contraseña de Neon.
# Redis: por defecto localhost; ajusta host/port si usas otro servicio.
#
# En Neon: Connection details → host del pooler y base (p. ej. neondb).
# La URL del panel suele ser jdbc:postgresql://... — aquí debe ser r2dbc:postgresql://HOST:5432/DB?sslmode=require

spring:
  r2dbc:
    url: r2dbc:postgresql://TU_HOST_POOLER.neon.tech:5432/neondb?sslmode=require
    username: neondb_owner
    password: PEGA_AQUI_TU_CONTRASENA
  data:
    redis:
      host: localhost
      port: 6379
