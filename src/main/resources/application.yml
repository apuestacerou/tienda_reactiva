spring:
  application:
    name: reactiva
  # Solo Neon (PostgreSQL R2DBC). Sin H2 ni base en memoria.
  # Credenciales: application-local.yml junto al pom.xml (plantilla: application-local.yml.example).
  config:
    import: optional:file:./application-local.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

tienda:
  uploads:
    dir: ${user.dir}/uploads/productos
  public-files-base: /api/files
  jwt:
    secret: ${TIENDA_JWT_SECRET:esta-clave-secreta-debe-tener-al-menos-32-bytes-para-hs256-seguro}
    # Access JWT (corta duración). Refresh opaco en Redis con prefijos refresh: y user_token:
    expiration-ms: ${TIENDA_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${TIENDA_JWT_REFRESH_EXPIRATION_MS:604800000}
